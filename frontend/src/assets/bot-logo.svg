<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%" fill="none">
  <defs>
    <!-- Vibrant App Tile Gradient (Vivid Indigo to Electric Violet) -->
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="45%" stop-color="#6366f1" />
      <stop offset="80%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <!-- Top Bevel Gloss -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Crisp White Robot Shading -->
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="75%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Cyber Visor Dark Backdrop -->
    <linearGradient id="visorDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Cyan/Azure Eye Display -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- AI Intelligence Star Gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="eyeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Main Squircle Badge with Ambient Shadow -->
  <rect x="12" y="12" width="232" height="232" rx="58" fill="url(#tileGrad)" filter="url(#tileShadow)" />

  <!-- Glass Inset Highlight Border -->
  <rect x="13.5" y="13.5" width="229" height="229" rx="56.5" stroke="url(#glossGrad)" stroke-width="3" />

  <!-- Robot Top Antenna -->
  <path d="M128 62 L128 42" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
  <circle cx="128" cy="38" r="9" fill="#38bdf8" stroke="#ffffff" stroke-width="3" filter="url(#eyeGlow)" />

  <!-- Ear / Audio Modules -->
  <rect x="36" y="112" width="16" height="42" rx="8" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2" />
  <circle cx="44" cy="133" r="3.5" fill="#6366f1" />

  <rect x="204" y="112" width="16" height="42" rx="8" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2" />
  <circle cx="212" cy="133" r="3.5" fill="#7c3aed" />

  <!-- Main Robot Head (Bright High-Contrast White Chassis) -->
  <rect x="46" y="62" width="164" height="136" rx="44" fill="url(#chassisGrad)" />
  <rect x="47.5" y="63.5" width="161" height="133" rx="42.5" stroke="#ffffff" stroke-width="3" />

  <!-- Deep Midnight Visor Screen -->
  <rect x="62" y="96" width="132" height="66" rx="24" fill="url(#visorDark)" stroke="#1e293b" stroke-width="2" />

  <!-- Visor Top Glare Highlight -->
  <path d="M78 103 Q128 100 178 103" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round" />

  <!-- Glowing Cyber Eyes -->
  <!-- Left Eye -->
  <g filter="url(#eyeGlow)">
    <circle cx="98" cy="129" r="13" fill="url(#cyanGlow)" />
    <circle cx="98" cy="129" r="6" fill="#ffffff" />
    <circle cx="95" cy="126" r="2.5" fill="#ffffff" />
  </g>

  <!-- Right Eye -->
  <g filter="url(#eyeGlow)">
    <circle cx="158" cy="129" r="13" fill="url(#cyanGlow)" />
    <circle cx="158" cy="129" r="6" fill="#ffffff" />
    <circle cx="155" cy="126" r="2.5" fill="#ffffff" />
  </g>

  <!-- Friendly Voice Wave / Smile Indicator -->
  <path d="M112 176 Q128 186 144 176" stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round" fill="none" />

  <!-- AI Sparkle / Star (Top Right of Badge) -->
  <g transform="translate(190, 24) scale(0.9)" filter="url(#eyeGlow)">
    <path d="M20 0 C20 11 29 20 40 20 C29 20 20 29 20 40 C20 29 11 20 0 20 C11 20 20 11 20 0 Z" fill="url(#starGrad)" />
  </g>
</svg>
