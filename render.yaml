services:
  - type: web
    name: ai-chatbot-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: RATE_LIMIT_PER_MINUTE
        value: "20/minute"
      - key: GEMINI_MODEL
        value: "gemini-3.5-flash-lite"
      - key: EMBEDDING_MODEL
        value: "gemini-embedding-001"
      - key: TEMPERATURE
        value: "0.2"
      - key: ENVIRONMENT
        value: "production"
